schema: 1
repo: "github.com/Blackfire-AI/brigada"
default_check: 'test -z "$(gofmt -l .)" && go run ./internal/tools/guard && go vet ./... && go test ./...'
worker_tools: "Bash(go build:*)+Bash(go test:*)+Bash(go vet:*)+Bash(gofmt:*)+Bash(go version:*)+Bash(go run ./internal/tools/guard:*)+Bash(git log:*)+Bash(git diff:*)+Bash(git show:*)+Bash(git status:*)+Bash(ls:*)"
land_target: "brigada/landed"
after_land: ".brigada/after-land.sh"
instructions:
  foreman: .brigada/instructions/foreman.md
  plan_review: .brigada/instructions/plan_review.md
  worker: .brigada/instructions/worker.md
  reviewer: .brigada/instructions/reviewer.md
skills_dir: .brigada/skills
