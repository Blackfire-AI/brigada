# §6.1: the graph. A task waits (pending) until every task named in deps is
# done; its work starts from the branch of base, one of deps — the continued
# dep when base is empty and continue is set, else the default branch; merge a
# task after its base. A task with continue, one of deps, starts in the
# session of the dep's author.
# States are the engine's (§6.1), rounds the fix and review rounds
# spent (§7), question the worker's open question (§3), when it has one.
# Optional tier (light, standard, heavy) and effort (low, medium, high, max)
# describe the model needed and how hard it should think (§6.1);
# review_tier and review_effort do the same for its reviews (§7, §8); caps
# override the task's fix_rounds, review_rounds and restart budgets (§6.1);
# skills name the project's skills the task carries, in order (§5.10);
# tool_grants name the permission patterns its worker is granted (§6.1);
# wait_landed holds a dependent pending until its implement deps have
# actually landed on the target, not merely been done (§6.1).
