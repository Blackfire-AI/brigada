title = "brigada gitleaks config"

# Passed explicitly with --config in CI. It is deliberately not a root
# .gitleaks.toml, which any local gitleaks run would pick up.
#
# gitleaks scans the whole history; internal/tools/guard scans the tracked
# tree. The credential shapes come from the default rules; the rules below
# add the private and local IPv4 ranges guard treats as leaks.

[extend]
useDefault = true

[[rules]]
id = "private-ipv4"
description = "Private, carrier-grade NAT or link-local IPv4 address"
# 10/8, 172.16/12, 192.168/16, 100.64/10 and 169.254/16. The address must
# not be glued to a longer run of digits and dots, which is a version string;
# a dot that does not continue such a run is punctuation. Leading zeros count
# as decimal, as in guard. There are no keywords: they would be a second
# filter to keep in line with guard.
regex = '''(?:^|[^0-9.]|(?:^|[^0-9])\.)((?:0?10(?:\.(?:25[0-5]|2[0-4][0-9]|[01]?[0-9]?[0-9])){3}|172\.0?(?:1[6-9]|2[0-9]|3[01])(?:\.(?:25[0-5]|2[0-4][0-9]|[01]?[0-9]?[0-9])){2}|192\.168(?:\.(?:25[0-5]|2[0-4][0-9]|[01]?[0-9]?[0-9])){2}|100\.(?:0?(?:6[4-9]|[7-9][0-9])|1[01][0-9]|12[0-7])(?:\.(?:25[0-5]|2[0-4][0-9]|[01]?[0-9]?[0-9])){2}|169\.254(?:\.(?:25[0-5]|2[0-4][0-9]|[01]?[0-9]?[0-9])){2}))(?:$|[^0-9.]|\.(?:$|[^0-9]))'''
secretGroup = 1

[[allowlists]]
description = "test fixtures"
paths = [
  '''_test\.go$''',
  '''(?:^|/)testdata/''',
]

[[allowlists]]
description = "loopback and documentation addresses (192.0.2/24, 198.51.100/24, 203.0.113/24), as in guard"
regexes = [
  '''^127\.[0-9]+\.[0-9]+\.[0-9]+$''',
  '''^192\.0\.2\.[0-9]+$''',
  '''^198\.51\.100\.[0-9]+$''',
  '''^203\.0\.113\.[0-9]+$''',
]
