name: release

on:
  push:
    tags:
      - "v*"

# Jobs grant themselves what they need; the workflow default is read-only.
permissions:
  contents: read

jobs:
  # The checks CI runs: gofmt, guard, vet, test, race, govulncheck, gitleaks.
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: checks
    runs-on: ubuntu-latest
    # Creating the release and uploading assets needs contents:write. The
    # attestation needs id-token:write to get a signing identity from GitHub
    # and attestations:write plus artifact-metadata:write to store it.
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 1.27.x
      # Fails when the tag has no CHANGELOG section.
      - name: notes
        run: go run ./internal/tools/relnotes CHANGELOG.md "$GITHUB_REF_NAME" > release-notes.md
      # modernc.org/sqlite is pure Go and the module has no cgo files or build
      # constraints, so CGO_ENABLED=0 cross-compiles every target from this
      # one runner. -trimpath, -buildvcs=false and an empty build id keep the
      # binary independent of paths, VCS state and the build cache.
      - name: build
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir dist stage
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="brigada-${os}-${arch}"
            GOOS="$os" GOARCH="$arch" go build -trimpath -buildvcs=false \
              -ldflags "-s -w -buildid= -X github.com/Blackfire-AI/brigada/internal/version.Version=${version}" \
              -o "stage/brigada" ./cmd/brigada
            # Raw binary (curl-able) and a tarball holding the same binary.
            cp stage/brigada "dist/${name}"
            # Fixed order, owner and mtime and no gzip header name or time, so
            # the tarball is as reproducible as the binary.
            tar -C stage --sort=name --owner=0 --group=0 --numeric-owner \
              --mtime=@0 -cf - brigada | gzip -n > "dist/${name}.tar.gz"
          done
      # nfpm stays out of go.mod: a pinned release archive checked against the
      # release's own checksums file, as CI does for gitleaks.
      - name: install nfpm
        env:
          NFPM_VERSION: 2.49.0
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          base="https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}"
          archive="nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSL -o "$dir/$archive" "$base/$archive"
          curl -fsSL -o "$dir/checksums.txt" "$base/checksums.txt"
          (cd "$dir" && grep " $archive\$" checksums.txt | sha256sum -c -)
          tar -xzf "$dir/$archive" -C "$dir" nfpm
          sudo install "$dir/nfpm" /usr/local/bin/nfpm
      # One .deb and one .rpm per arch from dist/brigada-linux-<arch> (never
      # stage/brigada, which the build loop overwrites). A tag v<base>-<suffix>
      # becomes nfpm's version <base> and prerelease <suffix>; nfpm renders the
      # deb prerelease with a tilde and carries the same tilde form into the
      # rpm Version (Release defaults to 1), so a prerelease sorts before the
      # final and no dash ever lands in an rpm Version.
      - name: packages
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          export VERSION="${tag%%-*}"
          PRERELEASE=""
          if [[ "$tag" == *-* ]]; then
            PRERELEASE="${tag#*-}"
          fi
          export PRERELEASE
          for arch in amd64 arm64; do
            for packager in deb rpm; do
              ARCH="$arch" nfpm package --config .nfpm.yaml --packager "$packager" --target dist/
            done
          done
      # The packages must exist before SHA256SUMS is written, so they are
      # checksummed and attested like the tarballs.
      - name: checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum brigada-* brigada_*.deb > SHA256SUMS
          ls -l
      # Signs a provenance attestation for every checksum in SHA256SUMS, which
      # lists each file the release publishes. Users check it with
      # `gh attestation verify`.
      - name: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_args=(--title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* "${release_args[@]}"

  homebrew:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 1.27.x
      - name: generate formula
        run: |
          set -euo pipefail
          mkdir -p dist
          curl --fail --location --retry 3 \
            "https://github.com/Blackfire-AI/brigada/releases/download/${GITHUB_REF_NAME}/SHA256SUMS" \
            --output dist/SHA256SUMS
          go run ./internal/tools/brewformula -version "${GITHUB_REF_NAME#v}" -sums dist/SHA256SUMS > brigada.rb
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Blackfire-AI/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: update tap
        working-directory: homebrew-tap
        run: |
          set -euo pipefail
          mkdir -p Formula
          cp ../brigada.rb Formula/brigada.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/brigada.rb
          if ! git diff --cached --quiet; then
            git commit -m "brigada ${GITHUB_REF_NAME#v}"
            git push
          fi
