name: ci

# Tag pushes are covered by release.yml, which calls this workflow.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  # The plain test step below may reuse Go's test cache: a cached pass is
  # valid because the result depends only on inputs Go tracks (the files,
  # env vars and flags the test reads), so an unchanged tree skips work.
  # The race shards may not: they run -count=1 on purpose, re-running
  # timing- and race-sensitive tests every time, since a cached pass would
  # hide flakes and races. CI=true is read by the test step; Go keys the
  # test cache on env vars the test reads, so it stays correct.
  # Cache is setup-go's built-in one (GOCACHE and GOMODCACHE), keyed on
  # runner OS, Go version and hashes of go.sum and this workflow file.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
          cache: true
          cache-dependency-path: |
            go.sum
            .github/workflows/ci.yml
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: shellcheck
        run: shellcheck install.sh scripts/race-shard.sh scripts/land-ready.sh
      - name: guard
        run: go run ./internal/tools/guard
      - name: vet
        run: go vet ./...
      - name: test
        # CI=true makes the notices freshness test fail rather than skip
        # when go-licenses, the module cache or the network is missing.
        env:
          CI: "true"
        run: go test ./...

  test-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
      - name: test
        run: go test -count=1 ./...

  govulncheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  race-shard:
    name: race-shard (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # scripts/race-shard.sh defines the shards: internal/engine's
        # tests split by name three ways, since that package alone
        # outlasts the rest under -race; then store, runner and api;
        # cmd/brigada; and every other package.
        shard: [engine-1, engine-2, engine-3, core, cmd, rest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: setup-go
        with:
          go-version: 1.27.x
          # The race build has a cache of its own, below: setup-go's
          # is keyed for the plain build.
          cache: false
      # The -race compile of the dependencies (modernc.org/sqlite above
      # all) takes about a minute per shard. The build cache keeps it;
      # -count=1 still re-runs every test, since it bypasses only the
      # test result cache. The key changes with the Go version and
      # go.sum; one shard saves it, the others restore it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-race-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-race-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-
      - name: race
        run: scripts/race-shard.sh "${{ matrix.shard }}"

  # Aggregator: the required check name `race` must keep existing, but the
  # work is split across race-shard matrix jobs, so this one reports for them.
  race:
    name: race
    needs: [race-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: all shards passed
        env:
          RESULT: ${{ needs.race-shard.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "race-shard result: $RESULT" >&2
            exit 1
          fi

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.28.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: install gitleaks
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$dir/$archive" "$base/$archive"
          curl -fsSL -o "$dir/checksums.txt" "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd "$dir" && grep " $archive\$" checksums.txt | sha256sum -c -)
          tar -xzf "$dir/$archive" -C "$dir" gitleaks
          sudo install "$dir/gitleaks" /usr/local/bin/gitleaks
      - name: gitleaks
        run: |
          # gitleaks exits 0 when its internal git log fails, so an error
          # line in its output fails the step too.
          status=0
          gitleaks git --config .github/gitleaks.toml --redact --no-banner \
            --log-level info . 2> gitleaks.err || status=$?
          cat gitleaks.err
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if grep -Eq '(^|[[:space:]])(ERR|FTL)([[:space:]]|$)' gitleaks.err; then
            echo "gitleaks reported an error" >&2
            exit 1
          fi
