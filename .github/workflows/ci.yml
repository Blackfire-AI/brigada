name: ci

# Tag pushes are covered by release.yml, which calls this workflow.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: guard
        run: go run ./internal/tools/guard
      - name: vet
        run: go vet ./...
      - name: test
        # CI=true makes the notices freshness test fail rather than skip
        # when go-licenses, the module cache or the network is missing.
        env:
          CI: "true"
        run: go test ./...

  test-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
      - name: test
        run: go test -count=1 ./...

  govulncheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  race-shard:
    name: race-shard (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
      - name: race
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          mod="$(go list -m)"
          case "$SHARD" in
            1) pkgs="$(go list ./... | grep -E "^${mod}/internal/(engine|store)(/|\$)" || true)" ;;
            2) pkgs="$(go list ./... | grep -E "^${mod}/internal/(runner|api)(/|\$)" || true)" ;;
            3) pkgs="$(go list ./... | grep -Ev "^${mod}/internal/(engine|store|runner|api)(/|\$)" || true)" ;;
            *) echo "unknown shard $SHARD" >&2; exit 1 ;;
          esac
          if [ -z "$pkgs" ]; then
            echo "shard $SHARD has no packages" >&2
            exit 1
          fi
          echo "$pkgs"
          # shellcheck disable=SC2086
          CGO_ENABLED=1 go test -race -count=1 $pkgs

  # Aggregator: the required check name `race` must keep existing, but the
  # work is split across race-shard matrix jobs, so this one reports for them.
  race:
    name: race
    needs: [race-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: all shards passed
        env:
          RESULT: ${{ needs.race-shard.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "race-shard result: $RESULT" >&2
            exit 1
          fi

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.28.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: install gitleaks
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$dir/$archive" "$base/$archive"
          curl -fsSL -o "$dir/checksums.txt" "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd "$dir" && grep " $archive\$" checksums.txt | sha256sum -c -)
          tar -xzf "$dir/$archive" -C "$dir" gitleaks
          sudo install "$dir/gitleaks" /usr/local/bin/gitleaks
      - name: gitleaks
        run: |
          # gitleaks exits 0 when its internal git log fails, so an error
          # line in its output fails the step too.
          status=0
          gitleaks git --config .github/gitleaks.toml --redact --no-banner \
            --log-level info . 2> gitleaks.err || status=$?
          cat gitleaks.err
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if grep -Eq '(^|[[:space:]])(ERR|FTL)([[:space:]]|$)' gitleaks.err; then
            echo "gitleaks reported an error" >&2
            exit 1
          fi
