name: ci

# Tag pushes are covered by release.yml, which calls this workflow.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: guard
        run: go run ./internal/tools/guard
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...

  test-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
      - name: test
        run: go test -count=1 ./...

  govulncheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  race:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
      - name: race
        run: CGO_ENABLED=1 go test -race -count=1 ./...

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.28.0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: install gitleaks
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$dir/$archive" "$base/$archive"
          curl -fsSL -o "$dir/checksums.txt" "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd "$dir" && grep " $archive\$" checksums.txt | sha256sum -c -)
          tar -xzf "$dir/$archive" -C "$dir" gitleaks
          sudo install "$dir/gitleaks" /usr/local/bin/gitleaks
      - name: gitleaks
        run: |
          # gitleaks exits 0 when its internal git log fails, so an error
          # line in its output fails the step too.
          status=0
          gitleaks git --config .github/gitleaks.toml --redact --no-banner \
            --log-level info . 2> gitleaks.err || status=$?
          cat gitleaks.err
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if grep -Eq '(^|[[:space:]])(ERR|FTL)([[:space:]]|$)' gitleaks.err; then
            echo "gitleaks reported an error" >&2
            exit 1
          fi
