name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.x
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: guard
        run: go run ./internal/tools/guard
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
