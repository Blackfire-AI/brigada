name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.x
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: guard
        run: go run ./internal/tools/guard
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...

  race:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.x
      - name: race
        run: CGO_ENABLED=1 go test -race -count=1 ./...

  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.28.0
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: install gitleaks
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$dir/$archive" "$base/$archive"
          curl -fsSL -o "$dir/checksums.txt" "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd "$dir" && grep " $archive\$" checksums.txt | sha256sum -c -)
          tar -xzf "$dir/$archive" -C "$dir" gitleaks
          sudo install "$dir/gitleaks" /usr/local/bin/gitleaks
      - name: gitleaks
        run: |
          # gitleaks exits 0 when its internal git log fails, so an error
          # line in its output fails the step too.
          status=0
          gitleaks git --config .github/gitleaks.toml --redact --no-banner \
            --log-level info . 2> gitleaks.err || status=$?
          cat gitleaks.err
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if grep -Eq '(^|[[:space:]])(ERR|FTL)([[:space:]]|$)' gitleaks.err; then
            echo "gitleaks reported an error" >&2
            exit 1
          fi
